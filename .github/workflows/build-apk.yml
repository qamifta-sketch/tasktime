name: Build TaskTime APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================
      # 1. Checkout Repository
      # =========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================
      # 2. Setup Node.js
      # =========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # =========================================
      # 3. Install Capacitor
      # =========================================
      - name: Install Capacitor
        run: |
          npm install @capacitor/core
          npm install @capacitor/cli
          npm install @capacitor/android


      # =========================================
      # 4. Create Capacitor Config
      # =========================================
      - name: Create Capacitor config
        run: |
          npx cap init TaskTime com.tasktime.app --web-dir www


      # =========================================
      # 5. Prepare Website Files
      # =========================================
      - name: Prepare web files
        run: |
          mkdir -p www

          cp index.html www/index.html
          cp style.css www/style.css
          cp script.js www/script.js
          cp manifest.json www/manifest.json

          if [ -f service-worker.js ]; then
            cp service-worker.js www/service-worker.js
          fi

          if [ -f firebase-messaging-sw.js ]; then
            cp firebase-messaging-sw.js www/firebase-messaging-sw.js
          fi


      # =========================================
      # 6. Add Android Platform
      # =========================================
      - name: Add Android
        run: |
          npx cap add android


      # =========================================
      # 7. Copy Firebase Configuration
      # =========================================
      - name: Copy google-services.json
        run: |
          if [ ! -f google-services.json ]; then
            echo "ERROR: google-services.json tidak ditemukan!"
            exit 1
          fi

          cp google-services.json android/app/google-services.json


      # =========================================
      # 8. Install Firebase Capacitor Push Notifications
      # =========================================
      - name: Install Capacitor Push Notifications
        run: |
          npm install @capacitor/push-notifications


      # =========================================
      # 9. Sync Capacitor
      # =========================================
      - name: Sync Capacitor
        run: |
          npx cap sync android


      # =========================================
      # 10. Setup Java 21
      # =========================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle


      # =========================================
      # 11. Make Gradle Executable
      # =========================================
      - name: Make Gradle executable
        run: |
          chmod +x android/gradlew


      # =========================================
      # 12. Build Debug APK
      # =========================================
      - name: Build APK
        working-directory: android
        run: |
          ./gradlew assembleDebug


      # =========================================
      # 13. Upload APK
      # =========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskTime-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
